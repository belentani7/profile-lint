[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-lint"
version = "0.2.0"
description = "Comprueba enlaces, texto alternativo y afirmaciones en README de perfiles de GitHub."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Belentani" }]
keywords = ["github", "profile", "readme", "lint", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build==1.4.2; python_version < '3.10'",
    "build==1.6.1; python_version >= '3.10'",
    "ruff==0.17.6",
]

[project.scripts]
profile-lint = "profilelint.cli:main"

[project.urls]
Homepage = "https://github.com/belentani7/profile-lint"
Issues = "https://github.com/belentani7/profile-lint/issues"

[tool.setuptools]
packages = ["profilelint"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
