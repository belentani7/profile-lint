[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-lint"
version = "0.1.0"
description = "Check a GitHub profile README for dead links, missing alt text and unverifiable claims."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pedro Belentani", url = "https://belentani.es" }]
keywords = ["github", "profile", "readme", "lint", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
profile-lint = "profilelint.cli:main"

[project.urls]
Homepage = "https://github.com/belentani7/profile-lint"

[tool.setuptools]
packages = ["profilelint"]
